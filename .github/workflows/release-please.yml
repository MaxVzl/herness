name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
      # Archive installée par install.sh : contrat « herness-<version>.tar.gz, avec bin/herness ».
      - name: Archive de la version
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          v=${TAG#v}
          git fetch --depth=1 origin tag "$TAG"
          git archive --format=tar.gz --prefix="herness-$v/" -o "herness-$v.tar.gz" "$TAG"
          tar -tzf "herness-$v.tar.gz" | grep -qx "herness-$v/bin/herness"
          gh release upload "$TAG" "herness-$v.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
      # L'auteur est trouvé par la PR ou, à défaut, par le commit. Les lignes déjà
      # annotées, venues de la PR de release, ne bougent pas.
      - name: Auteurs des PR dans les notes de release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          .github/scripts/auteurs-notes.sh "$GITHUB_REPOSITORY" < notes.md > notes-auteurs.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes-auteurs.md
      # release-please réécrit la description à chaque push, d'où une annotation à chaque passage.
      - name: Auteurs des PR dans la PR de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq .body > corps.md
          .github/scripts/auteurs-notes.sh "$GITHUB_REPOSITORY" < corps.md > corps-auteurs.md
          cmp -s corps.md corps-auteurs.md || gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --body-file corps-auteurs.md
