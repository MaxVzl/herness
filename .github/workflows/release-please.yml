name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
      # Archive installed by install.sh: contract "herness-<version>.tar.gz, with bin/herness".
      - name: Version archive
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          v=${TAG#v}
          git fetch --depth=1 origin tag "$TAG"
          git archive --format=tar.gz --prefix="herness-$v/" -o "herness-$v.tar.gz" "$TAG"
          tar -tzf "herness-$v.tar.gz" | grep -qx "herness-$v/bin/herness"
          gh release upload "$TAG" "herness-$v.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
      # The author comes from the PR or, failing that, from the commit. Lines already
      # annotated, coming from the release PR, stay as they are.
      - name: PR authors in the release notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          .github/scripts/authors-notes.sh "$GITHUB_REPOSITORY" < notes.md > notes-authors.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes-authors.md
      # release-please rewrites the description on every push, so annotate on every run.
      - name: PR authors in the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          .github/scripts/authors-notes.sh "$GITHUB_REPOSITORY" < body.md > body-authors.md
          cmp -s body.md body-authors.md || gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --body-file body-authors.md
